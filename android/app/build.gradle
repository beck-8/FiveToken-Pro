def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdkVersion 29

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "io.fivetokenpro.fil"
        minSdkVersion 20
        targetSdkVersion 29
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
       // Community shared key, committed to the repo. Both debug and release
       // builds sign with this by default, so APKs built by ANYONE (you, or
       // a user compiling later) carry the same signature and can update over
       // each other in place WITHOUT uninstalling / wiping wallet data.
       // NOTE: this key is public — a shared signature is not a proof of trust.
       // It is for build/update compatibility, not anti-tampering. If you want
       // your own private signing identity, drop in android/key.properties and
       // release builds will use that instead (see android/key.properties.example).
       shared {
           keyAlias 'fivetoken'
           keyPassword 'fivetoken'
           storeFile rootProject.file('fivetoken-shared.jks')
           storePassword 'fivetoken'
       }
       release {
           // Only configure release signing when a private key.properties
           // (+ keystore) is present; otherwise file(null) would fail eval.
           if (keystorePropertiesFile.exists()) {
               keyAlias keystoreProperties['keyAlias']
               keyPassword keystoreProperties['keyPassword']
               storeFile file(keystoreProperties['storeFile'])
               storePassword keystoreProperties['storePassword']
           }
       }
   }
    buildTypes {
        debug {
            // Use the shared key (not the per-machine ~/.android/debug.keystore)
            // so debug APKs from different machines stay update-compatible.
            signingConfig signingConfigs.shared
        }
        release {
            // Private key.properties wins if provided; otherwise the shared key.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.shared
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
}
